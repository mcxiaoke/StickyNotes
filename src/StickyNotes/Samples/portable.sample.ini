# StickyNotes 便携模式标志文件 (portable.sample.ini)
# 
# 使用方式：
# 将本文件复制或重命名为 portable.ini（或在 StickyNotes.exe 同目录下新建一个名为 portable.ini 的空文件即可）。
# 
# 效果说明：
# 1. 当 StickyNotes.exe 同目录下存在 portable.ini 时，程序自动启用便携绿化模式。
# 2. 所有数据和配置文件都会存放在 exe 目录下的 app_data 子目录中：
#    - <exe目录>\app_data\notes.db      （SQLite 便签数据库）
#    - <exe目录>\app_data\settings.json （设置配置文件）
#    - <exe目录>\app_data\window.json   （主窗口尺寸与位置记忆）
#    - <exe目录>\app_data\backups\      （数据库轮转备份目录）
#    - <exe目录>\app_data\logs\         （运行日志目录）
# 3. 后续更新升级软件时，直接覆盖 exe 与程序主文件即可，绝不会影响或误覆盖 app_data 中的便签数据与配置。
# 4. 若不存在 portable.ini，则默认为 Windows 标准漫游模式，数据存放在 %LOCALAPPDATA%\StickyNotes 目录中。
